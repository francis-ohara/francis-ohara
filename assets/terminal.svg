<svg xmlns="http://www.w3.org/2000/svg" width="800" height="224" viewBox="0 0 800 224" role="img" aria-label="Terminal: francis o'hara aidoo, full-stack software engineer, CS at Colby College '27, currently Platform AI at Medidata, seeking 2027 SWE and data science roles">
  <style>
    #seeking-cover {
      transform-box: view-box;
      transform-origin: 0px 0px;
      animation: seeking-cover 8s infinite;
    }
    #seeking-cursor {
      animation: seeking-cursor-blink 8s step-end infinite;
    }
    @keyframes seeking-cover {
      0% { transform: translate(0, 0); animation-timing-function: steps(38, end); }
      40% { transform: translate(320.3px, 0); animation-timing-function: linear; }
      89% { transform: translate(320.3px, 0); animation-timing-function: step-end; }
      90% { transform: translate(0, 0); }
      100% { transform: translate(0, 0); }
    }
    @keyframes seeking-cursor-blink {
      0%, 40% { opacity: 1; }
      44% { opacity: 0; }
      48% { opacity: 1; }
      52% { opacity: 0; }
      56% { opacity: 1; }
      60% { opacity: 0; }
      64% { opacity: 1; }
      68% { opacity: 0; }
      72% { opacity: 1; }
      76% { opacity: 0; }
      80% { opacity: 1; }
      84% { opacity: 0; }
      88% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #seeking-cover {
        animation: none;
        transform: translate(320.3px, 0);
      }
      #seeking-cursor {
        animation: seeking-cursor-idle 1s step-end infinite;
      }
    }
    @keyframes seeking-cursor-idle {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>
  <rect x="0.5" y="0.5" width="799" height="223" rx="10" fill="#161b22" stroke="#30363d"/>
  <line x1="0.5" y1="35" x2="799.5" y2="35" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#f85149"/>
  <circle cx="42" cy="18" r="6" fill="#d29922"/>
  <circle cx="62" cy="18" r="6" fill="#3fb950"/>
  <text x="82" y="22.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9198a1">francis@github: ~</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
    <text x="24" y="64"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    <text x="24" y="88" fill="#9198a1">francis o'hara aidoo · full-stack software engineer · cs @ colby college '27</text>
    <text x="24" y="120"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> cat now.txt</tspan></text>
    <text x="24" y="144" fill="#9198a1">platform ai @ medidata · building llm pipelines with frontier models on amazon bedrock</text>
    <text x="24" y="176"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> echo $SEEKING</tspan></text>
    <text id="seeking-text" x="24" y="200" fill="#58e87f" textLength="320.3" lengthAdjust="spacing">2027 new-grad swe &amp; data science roles</text>
    <g id="seeking-cover">
      <rect x="24" y="182" width="760" height="26" fill="#161b22"/>
      <rect id="seeking-cursor" x="24" y="187" width="8" height="14" fill="#58e87f"/>
    </g>
  </g>
</svg>
